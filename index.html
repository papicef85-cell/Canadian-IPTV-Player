<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canadian IPTV Player - Live TV Guide</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/epg.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🍁 Canadian IPTV Player</h1>
                <p class="subtitle">Legal Canadian Specialty Networks - 2005-2013 EPG Archive</p>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-wrapper">
            <!-- Left Sidebar - Channel List -->
            <aside class="sidebar-left">
                <div class="channels-section">
                    <h2>Channels</h2>
                    <div class="search-box">
                        <input type="text" id="channelSearch" placeholder="Search channels...">
                    </div>
                    <div id="channelList" class="channel-list"></div>
                </div>
            </aside>

            <!-- Center - Video Player & EPG -->
            <main class="main-content">
                <!-- Video Player -->
                <div class="player-wrapper">
                    <video id="videoPlayer" class="video-player" controls>
                        <source src="" type="application/x-mpegURL">
                        Your browser does not support the video tag.
                    </video>
                    <div class="player-info">
                        <h2 id="currentChannel">Select a Channel</h2>
                        <p id="currentProgram">No program information</p>
                    </div>
                </div>

                <!-- EPG Section -->
                <section class="epg-section">
                    <div class="epg-controls">
                        <h3>TV Guide (EPG)</h3>
                        <div class="filter-controls">
                            <div class="year-filter">
                                <label for="yearSelect">Filter by Year:</label>
                                <select id="yearSelect">
                                    <option value="all">All Years</option>
                                    <option value="2005">2005</option>
                                    <option value="2006">2006</option>
                                    <option value="2007">2007</option>
                                    <option value="2008">2008</option>
                                    <option value="2009">2009</option>
                                    <option value="2010">2010</option>
                                    <option value="2011">2011</option>
                                    <option value="2012">2012</option>
                                    <option value="2013">2013</option>
                                </select>
                            </div>
                            <div class="date-filter">
                                <label for="dateSelect">Select Date:</label>
                                <input type="date" id="dateSelect">
                            </div>
                        </div>
                    </div>

                    <!-- EPG Timeline -->
                    <div id="epgTimeline" class="epg-timeline">
                        <div class="time-slots" id="timeSlots"></div>
                        <div class="programs-container" id="programsContainer"></div>
                    </div>
                </section>
            </main>

            <!-- Right Sidebar - Schedule & Details -->
            <aside class="sidebar-right">
                <div class="schedule-section">
                    <h2>Today's Schedule</h2>
                    <div id="scheduleList" class="schedule-list"></div>
                </div>
                <div class="details-section">
                    <h2>Program Details</h2>
                    <div id="programDetails" class="program-details"></div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/channels.js"></script>
    <script src="js/epg.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
